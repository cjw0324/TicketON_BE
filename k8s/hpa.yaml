apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: queue-server-hpa
  namespace: ticketone
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: queue-server
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50         # CPU 50% 초과 시 scale out (requests=100m 기준 → 50m 이상)
